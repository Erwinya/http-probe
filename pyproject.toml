[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "http-probe"
version = "0.1.0"
description = "Lightweight HTTP health probe in pure Python (stdlib only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
http-probe = "http_probe:main"

[tool.setuptools]
py-modules = ["http_probe"]

[tool.setuptools.package-dir]
"" = "src"
