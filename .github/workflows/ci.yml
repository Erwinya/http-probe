name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: python src/http_probe.py https://example.com --timeout 15
